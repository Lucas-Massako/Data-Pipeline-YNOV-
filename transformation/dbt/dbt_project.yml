name: novamarket_dbt
version: "1.0.0"
config-version: 2
profile: novamarket_dbt
model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

# Matérialisations : staging en vues (légères, toujours à jour),
# intermediate en éphémère (réutilisable, compilé en CTE),
# marts en tables (résultat analytique stable et rapide à lire).
models:
  novamarket_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
